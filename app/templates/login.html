<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ark — sign in</title>
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="/static/manifest.json" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 14h18l-2.5 5.2c-.3.5-.8.8-1.4.8H6.9c-.6 0-1.1-.3-1.4-.8L3 14z"/><path d="M8 14V9.5C8 8.7 8.7 8 9.5 8h5c.8 0 1.5.7 1.5 1.5V14H8z"/></svg></span>
      <span class="brand-word">Ark</span>
    </div>
    <p class="brand-tag">History, as it would have trended.</p>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" data-tab="login">Sign in</button>
      <button type="button" class="auth-tab" data-tab="signup">Create account</button>
    </div>

    <form id="loginForm" class="composer auth-form">
      <label for="loginUsername">Username</label>
      <input type="text" id="loginUsername" autocomplete="username" required />
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
      <p class="composer-hint" id="loginHint"></p>
    </form>

    <form id="signupForm" class="composer auth-form" style="display:none;">
      <label for="signupUsername">Username</label>
      <input type="text" id="signupUsername" autocomplete="username" minlength="3" maxlength="32" required />
      <label for="signupPassword">Password</label>
      <input type="password" id="signupPassword" autocomplete="new-password" minlength="8" required />
      <p class="composer-hint" style="color: var(--text-dim);">At least 8 characters.</p>
      <button type="submit">Create account</button>
      <p class="composer-hint" id="signupHint"></p>
    </form>

    {% if google_enabled %}
    <div class="auth-divider"><span>or</span></div>
    <a href="/auth/google/login" class="google-btn">
      <svg viewBox="0 0 18 18" width="18" height="18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.92c1.7-1.57 2.68-3.88 2.68-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.71c-.18-.54-.28-1.11-.28-1.71s.1-1.17.28-1.71V4.95H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.05l3.01-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Continue with Google
    </a>
    {% endif %}
  </div>

<script>
const tabs = document.querySelectorAll(".auth-tab");
const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");
tabs.forEach((tab) => {
  tab.addEventListener("click", () => {
    tabs.forEach((t) => t.classList.toggle("active", t === tab));
    loginForm.style.display = tab.dataset.tab === "login" ? "flex" : "none";
    signupForm.style.display = tab.dataset.tab === "signup" ? "flex" : "none";
  });
});

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const hint = document.getElementById("loginHint");
  hint.textContent = "";
  try {
    const res = await fetch("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("loginUsername").value,
        password: document.getElementById("loginPassword").value,
      }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.detail || "Sign in failed");
    }
    window.location.href = "/";
  } catch (err) {
    hint.textContent = err.message;
  }
});

signupForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const hint = document.getElementById("signupHint");
  hint.textContent = "";
  try {
    const res = await fetch("/auth/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("signupUsername").value,
        password: document.getElementById("signupPassword").value,
      }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.detail || "Could not create account");
    }
    window.location.href = "/";
  } catch (err) {
    hint.textContent = err.message;
  }
});
</script>
</body>
</html>
